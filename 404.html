<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#f5f0e8" />
  <title>Page Not Found | Omo Research</title>
  <link rel="icon" href="/assets/omo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
    .not-found-inner { max-width: 34rem; }
    .not-found-code { margin-bottom: 1rem; font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-2); letter-spacing: 0.14em; }
    .not-found h1 { margin-bottom: 1rem; }
    .not-found p { margin-bottom: 2rem; color: var(--text-2); font-size: 1.05rem; }
  </style>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code">404 / NOT FOUND</p>
      <h1>This space is still empty.</h1>
      <p>The page may have moved, or it may not exist yet.</p>
      <a class="btn btn-dark" href="/">Return home</a>
    </div>
  </main>
</body>
</html>
