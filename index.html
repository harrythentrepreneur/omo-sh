<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Omo Research builds AI agents that work in voice, space, and real time — on consumer hardware, open source." />
  <meta name="theme-color" content="#f5f0e8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><line x1='20' y1='20' x2='20' y2='180' stroke='%231a1008' stroke-width='12'/><line x1='20' y1='20' x2='100' y2='20' stroke='%231a1008' stroke-width='12'/><line x1='20' y1='180' x2='180' y2='180' stroke='%231a1008' stroke-width='12'/><line x1='100' y1='20' x2='135' y2='20' stroke='%231a1008' stroke-width='12'/><line x1='180' y1='20' x2='180' y2='95' stroke='%231a1008' stroke-width='12'/><line x1='180' y1='120' x2='180' y2='180' stroke='%231a1008' stroke-width='12'/><rect x='90' y='90' width='16' height='16' fill='%231a1008'/></svg>" />
  <title>Omo Research — Voice, Space, Presence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ink: #1a1008;
      --near-ink: #2c2015;
      --dark-taupe: #4a3b2f;
      --mid-taupe: #8a7865;
      --light-taupe: #c4b8a8;
      --paper: #f5f0e8;
      --bg-card: #faf7f2;
      --border: #d4cdc0;
      --font-body: "Crimson Text", Georgia, "Times New Roman", serif;
      --font-mono: "IBM Plex Mono", "SF Mono", "Menlo", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero {
      text-align: center;
      padding: 4rem 2rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
    }

    /* ---- Logo mark — unbound icon ---- */
    .hero-mark {
      display: flex;
      justify-content: center;
      margin-bottom: 2.25rem;
    }
    .hero-mark svg {
      width: 200px;
      height: 200px;
    }

    /* ---- Headline — serif, italic ---- */
    .hero-tagline {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(1.6rem, 3.6vw, 2.4rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    /* ---- Subtitle ---- */
    .hero-subtitle {
      font-family: var(--font-body);
      font-size: clamp(1rem, 1.5vw, 1.18rem);
      color: var(--dark-taupe);
      line-height: 1.7;
      max-width: 34rem;
      margin: 0 auto 2.5rem auto;
    }

    /* ---- Actions ---- */
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.8rem 1.8rem;
      border-radius: 6px;
      border: 1px solid transparent;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 140ms, border-color 140ms, transform 140ms;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .btn-dark {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .btn-dark:hover { background: var(--near-ink); border-color: var(--near-ink); transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border-color: var(--border);
    }
    .btn-outline:hover { border-color: var(--ink); background: rgba(26,16,8,0.04); transform: translateY(-1px); }

    /* ---- Stats — simple line ---- */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      max-width: 700px;
      margin: 0 auto;
      font-family: var(--font-mono);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .stat-value {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
    }

    .stat-label {
      font-size: 0.6rem;
      color: var(--mid-taupe);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--light-taupe);
    }

    .stat-link { text-decoration: none; color: var(--mid-taupe); }
    .stat-link:hover { color: var(--ink); }

    @media (max-width: 768px) {
      .hero { padding: 2.5rem 1rem 3.5rem; }
      .hero-visual { max-width: 100%; aspect-ratio: 1/1; }
      .hero-tagline { font-size: 1.4rem; }
      .stats-row { gap: 1rem; }
    }

    @media (max-width: 480px) {
      .hero-actions { flex-direction: column; align-items: center; }
      .hero-actions .btn { width: 100%; max-width: 16rem; justify-content: center; }
      .stats-row { gap: 0.75rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- Logo mark — Yifan Unbound fracturing double-frame icon -->
    <div class="hero-mark">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Omo Research — unbound mark">
        <!-- YIFAN UNBOUND — one half pristine, the other fracturing -->

        <!-- Outer frame — left side and bottom intact, right side fracturing -->
        <line x1="20" y1="20" x2="20" y2="180" stroke="#1a1008" stroke-width="8"/>
        <line x1="20" y1="20" x2="100" y2="20" stroke="#1a1008" stroke-width="8"/>
        <line x1="20" y1="180" x2="180" y2="180" stroke="#1a1008" stroke-width="8"/>

        <!-- Right side of frame — fracturing into scattered segments -->
        <line x1="100" y1="20" x2="130" y2="20" stroke="#1a1008" stroke-width="8"/>
        <line x1="140" y1="20" x2="160" y2="20" stroke="#1a1008" stroke-width="8"/>
        <line x1="180" y1="20" x2="180" y2="60" stroke="#1a1008" stroke-width="8"/>
        <line x1="180" y1="72" x2="180" y2="110" stroke="#1a1008" stroke-width="8"/>
        <line x1="180" y1="120" x2="180" y2="150" stroke="#1a1008" stroke-width="8"/>
        <line x1="180" y1="160" x2="180" y2="180" stroke="#1a1008" stroke-width="8"/>

        <!-- Inner frame — left side intact, right side shattering -->
        <line x1="32" y1="32" x2="32" y2="168" stroke="#1a1008" stroke-width="3"/>
        <line x1="32" y1="32" x2="100" y2="32" stroke="#1a1008" stroke-width="3"/>
        <line x1="32" y1="168" x2="168" y2="168" stroke="#1a1008" stroke-width="3"/>
        <!-- Right side fragments -->
        <line x1="105" y1="32" x2="125" y2="32" stroke="#1a1008" stroke-width="3"/>
        <line x1="138" y1="32" x2="155" y2="32" stroke="#1a1008" stroke-width="3"/>
        <line x1="168" y1="32" x2="168" y2="65" stroke="#1a1008" stroke-width="3"/>
        <line x1="168" y1="75" x2="168" y2="105" stroke="#1a1008" stroke-width="3"/>
        <line x1="168" y1="115" x2="168" y2="140" stroke="#1a1008" stroke-width="3"/>
        <line x1="168" y1="150" x2="168" y2="168" stroke="#1a1008" stroke-width="3"/>

        <!-- "O" mark — left half intact circle, right half breaking into scattered rectangles -->
        <!-- Left arc — pristine -->
        <path d="M 62 100 A 30 30 0 0 1 100 70" fill="none" stroke="#1a1008" stroke-width="7"/>
        <path d="M 100 70 A 30 30 0 0 1 100 90" fill="none" stroke="#1a1008" stroke-width="7"/>
        <!-- Top-right arc segments — breaking -->
        <path d="M 100 90 A 30 30 0 0 1 125 108" fill="none" stroke="#1a1008" stroke-width="7"/>
        <path d="M 125 108 A 30 30 0 0 1 138 130" fill="none" stroke="#1a1008" stroke-width="7"/>
        <!-- Bottom arc — intact -->
        <path d="M 100 90 A 30 30 0 0 0 62 100" fill="none" stroke="#1a1008" stroke-width="7"/>

        <!-- Scattered rectangles — detaching from the right side of the O -->
        <rect x="130" y="110" width="8" height="8" fill="none" stroke="#1a1008" stroke-width="3" transform="rotate(15, 134, 114)"/>
        <rect x="142" y="100" width="6" height="6" fill="none" stroke="#1a1008" stroke-width="2" transform="rotate(-10, 145, 103)"/>
        <rect x="148" y="118" width="7" height="7" fill="none" stroke="#1a1008" stroke-width="2.5" transform="rotate(25, 151, 121)"/>
        <rect x="138" y="128" width="5" height="5" fill="none" stroke="#1a1008" stroke-width="2" transform="rotate(-20, 140, 130)"/>
        <rect x="152" y="108" width="5" height="5" fill="none" stroke="#1a1008" stroke-width="1.5" transform="rotate(8, 154, 110)"/>

        <!-- Detached floating piece — a rectangle that has broken free and is ascending -->
        <rect x="155" y="58" width="14" height="10" fill="none" stroke="#1a1008" stroke-width="3" transform="rotate(12, 162, 63)"/>
        <line x1="155" y1="68" x2="155" y2="80" stroke="#4a3b2f" stroke-width="1" stroke-dasharray="2,3"/>
        <line x1="164" y1="68" x2="164" y2="76" stroke="#4a3b2f" stroke-width="1" stroke-dasharray="2,3"/>

        <!-- Small filled dot — anchor, the center that remains -->
        <rect x="95" y="95" width="10" height="10" fill="#1a1008"/>

        <!-- Fracture lines radiating from the break zone -->
        <line x1="125" y1="108" x2="130" y2="100" stroke="#c4b8a8" stroke-width="1"/>
        <line x1="125" y1="108" x2="138" y2="118" stroke="#c4b8a8" stroke-width="1"/>
        <line x1="138" y1="130" x2="148" y2="125" stroke="#c4b8a8" stroke-width="1"/>
      </svg>
    </div>

    <!-- Tagline — serif italic -->
    <p class="hero-tagline">The next interface isn't a chat window.</p>

    <!-- Subtitle -->
    <p class="hero-subtitle">
      We explore voice, space, and presence as the primitives of human-agent interaction.
      We test ideas by building them.
    </p>

    <!-- CTAs -->
    <div class="hero-actions">
      <a class="btn btn-dark" href="https://github.com/harrythentrepreneur" target="_blank" rel="noopener">GitHub</a>
      <a class="btn btn-dark" href="/about">Research</a>
      <a class="btn btn-dark" href="/products">Products</a>
      <a class="btn btn-outline" href="/consulting">Contact</a>
    </div>

  </section>

</body>
</html>
